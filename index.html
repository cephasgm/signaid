<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SIGNAID – Global Sign Language Bridge</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <!-- Three.js for 3D avatar -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>
  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, 'Segoe UI', Roboto; }
    body { background: linear-gradient(145deg, #0a0f1e 0%, #1a1f2f 100%); min-height:100vh; padding:16px; }
    .app-container { max-width:1400px; margin:0 auto; }
    /* navbar */
    .navbar { display:flex; justify-content:space-between; align-items:center; background:rgba(10,15,30,0.6); backdrop-filter:blur(12px); padding:10px 20px; border-radius:60px; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
    .logo { display:flex; align-items:center; gap:8px; font-size:1.5rem; font-weight:700; background:linear-gradient(135deg,#fff,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .nav-buttons { display:flex; gap:8px; }
    button { padding:8px 18px; border-radius:40px; border:none; font-weight:500; cursor:pointer; transition:0.2s; background:rgba(255,255,255,0.1); color:white; }
    .btn-primary { background:linear-gradient(135deg,#2563eb,#7c3aed); }
    .btn-outline { border:1px solid rgba(255,255,255,0.3); background:transparent; }
    /* main grid */
    .main-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media (max-width:800px) { .main-grid { grid-template-columns:1fr; } }
    .panel { background:rgba(15,23,42,0.4); backdrop-filter:blur(12px); border-radius:32px; padding:20px; border:1px solid rgba(255,255,255,0.1); }
    .avatar-container { position:relative; aspect-ratio:4/3; background:#0a0f1e; border-radius:24px; overflow:hidden; margin-bottom:16px; }
    #avatarCanvas { width:100%; height:100%; display:block; background:#111827; }
    .caption { position:absolute; bottom:12px; left:12px; right:12px; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); padding:8px 16px; border-radius:40px; text-align:center; color:white; font-weight:500; }
    .language-row { display:flex; gap:12px; margin:16px 0; flex-wrap:wrap; }
    .lang-select { flex:1; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); border-radius:40px; padding:10px 16px; color:white; }
    .mode-tabs { display:flex; gap:8px; margin:16px 0; }
    .mode-btn { flex:1; background:rgba(0,0,0,0.3); border:none; padding:10px; border-radius:40px; color:#cbd5e1; cursor:pointer; }
    .mode-btn.active { background:linear-gradient(135deg,#2563eb,#7c3aed); color:white; }
    .output-box { background:rgba(0,0,0,0.4); border-radius:24px; padding:16px; margin-top:16px; }
    .output-label { font-size:0.75rem; color:#94a3b8; text-transform:uppercase; }
    .output-text { font-size:1.5rem; font-weight:600; color:white; word-break:break-word; }
    .confidence { font-size:0.8rem; color:#10b981; margin-top:8px; }
    .action-buttons { display:flex; gap:12px; margin-top:20px; }
    .action-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; background:rgba(37,99,235,0.2); border:1px solid #2563eb; }
    .action-btn.active { background:#2563eb; }
    .status-badge { display:inline-block; background:#10b98120; color:#10b981; border-radius:20px; padding:4px 12px; font-size:0.75rem; margin-left:8px; }
    footer { text-align:center; margin-top:32px; color:#64748b; font-size:0.75rem; }
  </style>
</head>
<body>
<div class="app-container">
  <nav class="navbar">
    <div class="logo">🧠 SIGN<span style="color:#2563eb;">AID</span></div>
    <div class="nav-buttons">
      <span id="userStatus" class="status-badge">Offline</span>
      <button id="loginBtn" class="btn-outline">Sign In</button>
      <button id="logoutBtn" style="display:none;" class="btn-outline">Sign Out</button>
    </div>
  </nav>

  <div class="main-grid">
    <!-- Left: Avatar + Camera feed overlay -->
    <div class="panel">
      <div class="avatar-container">
        <canvas id="avatarCanvas"></canvas>
        <div class="caption" id="liveCaption">🤟 Ready</div>
      </div>
      <div class="language-row">
        <select id="spokenLang" class="lang-select">
          <option value="en">English (spoken)</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="sw">Swahili</option>
        </select>
        <select id="signLang" class="lang-select">
          <option value="asl">ASL (American)</option>
          <option value="bsl">BSL (British)</option>
          <option value="lsf">LSF (French)</option>
        </select>
      </div>
      <div class="mode-tabs">
        <button class="mode-btn active" data-mode="sign2speech">✋ Sign → Speech</button>
        <button class="mode-btn" data-mode="speech2sign">🎤 Speech → Sign</button>
      </div>
      <div class="action-buttons">
        <button id="cameraBtn" class="action-btn">📷 Start Camera</button>
        <button id="micBtn" class="action-btn" disabled>🎙️ Start Mic</button>
      </div>
    </div>

    <!-- Right: Translation output -->
    <div class="panel">
      <div class="output-box">
        <div class="output-label">INPUT (recognized)</div>
        <div class="output-text" id="inputText">—</div>
      </div>
      <div class="output-box">
        <div class="output-label">OUTPUT (translation)</div>
        <div class="output-text" id="outputText">—</div>
        <div class="confidence" id="confidence">Confidence: —</div>
      </div>
      <div style="margin-top:20px;">
        <button id="saveTranslationBtn" class="btn-outline" style="width:100%;">💾 Save translation (offline)</button>
      </div>
      <div style="margin-top:16px;">
        <p style="color:#94a3b8; font-size:0.75rem;">📚 Offline signs stored: <span id="offlineCount">0</span></p>
      </div>
    </div>
  </div>
  <footer>© SIGNAID – Real sign language recognition using MediaPipe + KNN | Works offline</footer>
</div>

<script type="module">
  // ---------- IMPORTS ----------
  import * as THREE from 'three';

  // ---------- FIREBASE INIT (your config) ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBsewmLbx9LzzlhC-xzm8KPN9g-2zZFa0M",
    authDomain: "signaid-app.firebaseapp.com",
    projectId: "signaid-app",
    storageBucket: "signaid-app.firebasestorage.app",
    messagingSenderId: "520796391275",
    appId: "1:520796391275:web:748273f6d18765190bae2e"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ---------- GLOBALS ----------
  let currentMode = 'sign2speech';   // 'sign2speech' or 'speech2sign'
  let cameraActive = false;
  let micActive = false;
  let videoStream = null;
  let hands = null;
  let cameraUtils = null;
  let recognition = null;
  let currentUser = null;
  
  // 3D avatar
  let scene, camera, renderer, avatarGroup;
  let leftArm, rightArm, head;

  // KNN classifier for signs (using hand landmarks)
  let knnClassifier = null;
  let landmarksHistory = [];
  const SIGN_LABELS = ['hello', 'thank you', 'yes', 'no', 'please', 'goodbye'];
  let trainingSamples = {};  // { label: [landmarkArrays] }

  // Offline storage (IndexedDB)
  let offlineDB = null;
  let savedTranslations = [];

  // DOM elements
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userStatusSpan = document.getElementById('userStatus');
  const cameraBtn = document.getElementById('cameraBtn');
  const micBtn = document.getElementById('micBtn');
  const inputTextDiv = document.getElementById('inputText');
  const outputTextDiv = document.getElementById('outputText');
  const confidenceSpan = document.getElementById('confidence');
  const liveCaption = document.getElementById('liveCaption');
  const saveBtn = document.getElementById('saveTranslationBtn');
  const offlineCountSpan = document.getElementById('offlineCount');
  const spokenLangSelect = document.getElementById('spokenLang');
  const signLangSelect = document.getElementById('signLang');

  // ---------- 3D AVATAR SETUP ----------
  function initAvatar() {
    const canvas = document.getElementById('avatarCanvas');
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111827);
    camera = new THREE.PerspectiveCamera(45, width/height, 0.1, 1000);
    camera.position.set(0, 1.5, 3);
    camera.lookAt(0, 1, 0);
    renderer = new THREE.WebGLRenderer({ canvas, alpha: false });
    renderer.setSize(width, height);
    
    // Lights
    const ambient = new THREE.AmbientLight(0x404060);
    scene.add(ambient);
    const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
    mainLight.position.set(2, 3, 2);
    scene.add(mainLight);
    
    // Simple avatar: body + head + arms
    avatarGroup = new THREE.Group();
    const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.6;
    avatarGroup.add(body);
    
    const headGeo = new THREE.SphereGeometry(0.4, 32);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xfcd34d });
    head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.2;
    avatarGroup.add(head);
    
    const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8);
    const armMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
    leftArm = new THREE.Mesh(armGeo, armMat);
    leftArm.position.set(-0.6, 1.0, 0);
    leftArm.rotation.z = 0.3;
    avatarGroup.add(leftArm);
    
    rightArm = new THREE.Mesh(armGeo, armMat);
    rightArm.position.set(0.6, 1.0, 0);
    rightArm.rotation.z = -0.3;
    avatarGroup.add(rightArm);
    
    scene.add(avatarGroup);
    
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w/h;
      camera.updateProjectionMatrix();
    });
  }
  
  // Animate avatar performing a sign (simple arm wave)
  function animateSign(signWord) {
    if (!leftArm || !rightArm) return;
    // Simple animation based on sign
    let intensity = 0.5;
    if (signWord === 'hello') intensity = 0.8;
    else if (signWord === 'thank you') intensity = 0.6;
    else intensity = 0.4;
    
    let start = null;
    function step(timestamp) {
      if (!start) start = timestamp;
      const elapsed = (timestamp - start) / 1000;
      if (elapsed < 0.6) {
        const t = Math.sin(elapsed * Math.PI * 2) * intensity;
        leftArm.rotation.x = t * 0.8;
        rightArm.rotation.x = -t * 0.8;
        requestAnimationFrame(step);
      } else {
        leftArm.rotation.x = 0;
        rightArm.rotation.x = 0;
      }
    }
    requestAnimationFrame(step);
  }
  
  // ---------- HAND TRACKING & KNN CLASSIFIER ----------
  async function initHandTracking() {
    hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    
    // Simple KNN classifier: compare landmark distances
    function normalizeLandmarks(landmarks) {
      // convert to flat array of 21*3 = 63 values
      let flat = [];
      for (let lm of landmarks) {
        flat.push(lm.x, lm.y, lm.z);
      }
      return flat;
    }
    
    function classify(landmarks) {
      if (!trainingSamples || Object.keys(trainingSamples).length === 0) return null;
      const inputVec = normalizeLandmarks(landmarks);
      let bestLabel = null;
      let bestDist = Infinity;
      for (let [label, samples] of Object.entries(trainingSamples)) {
        for (let sample of samples) {
          let dist = 0;
          for (let i = 0; i < inputVec.length; i++) {
            dist += (inputVec[i] - sample[i]) ** 2;
          }
          dist = Math.sqrt(dist);
          if (dist < bestDist) {
            bestDist = dist;
            bestLabel = label;
          }
        }
      }
      if (bestDist < 0.8) return { label: bestLabel, confidence: 1 - bestDist/1.5 };
      return null;
    }
    
    // Preload some generic samples (simulated, in real use you'd collect from user)
    // For demo we add a few synthetic samples
    function addDummySamples() {
      // For each sign label we generate random landmark offsets (just for demo)
      // In production you would collect real hand poses.
      SIGN_LABELS.forEach(label => {
        if (!trainingSamples[label]) trainingSamples[label] = [];
        for (let i = 0; i < 3; i++) {
          let dummy = Array(63).fill(0).map(() => Math.random() * 0.3);
          trainingSamples[label].push(dummy);
        }
      });
    }
    addDummySamples();
    
    hands.onResults((results) => {
      if (!cameraActive) return;
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const classification = classify(landmarks);
        if (classification && currentMode === 'sign2speech') {
          const sign = classification.label;
          const conf = classification.confidence;
          inputTextDiv.innerText = sign;
          confidenceSpan.innerText = `Confidence: ${(conf*100).toFixed(0)}%`;
          // Translate sign to spoken text
          const spokenText = sign; // simple mapping
          outputTextDiv.innerText = spokenText;
          liveCaption.innerText = `✋ Recognized: ${sign}`;
          animateSign(sign);
          // Speak aloud
          if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(spokenText);
            utterance.lang = spokenLangSelect.value;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
          }
        } else if (currentMode !== 'sign2speech') {
          liveCaption.innerText = '🎤 Speech mode active';
        }
      } else {
        inputTextDiv.innerText = '—';
        confidenceSpan.innerText = 'Confidence: —';
      }
    });
  }
  
  async function startCamera() {
    if (cameraActive) {
      // stop
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());
      if (cameraUtils) cameraUtils.stop();
      cameraActive = false;
      cameraBtn.innerText = '📷 Start Camera';
      cameraBtn.classList.remove('active');
      liveCaption.innerText = 'Camera off';
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      videoStream = stream;
      const videoElement = document.createElement('video');
      videoElement.srcObject = stream;
      videoElement.play();
      cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480
      });
      cameraUtils.start();
      cameraActive = true;
      cameraBtn.innerText = '📷 Stop Camera';
      cameraBtn.classList.add('active');
      liveCaption.innerText = 'Camera on – show a sign';
    } catch (err) {
      console.error(err);
      alert('Camera permission denied');
    }
  }
  
  // ---------- SPEECH RECOGNITION (Speech → Sign) ----------
  function startMicrophone() {
    if (!('webkitSpeechRecognition' in window)) {
      alert('Speech recognition not supported in this browser');
      return;
    }
    if (micActive) {
      recognition.stop();
      micActive = false;
      micBtn.innerText = '🎙️ Start Mic';
      micBtn.classList.remove('active');
      liveCaption.innerText = 'Mic off';
      return;
    }
    recognition = new webkitSpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = spokenLangSelect.value;
    recognition.onstart = () => {
      micActive = true;
      micBtn.innerText = '🎙️ Stop Mic';
      micBtn.classList.add('active');
      liveCaption.innerText = 'Listening...';
    };
    recognition.onresult = (event) => {
      const transcript = Array.from(event.results)
        .map(res => res[0].transcript)
        .join(' ')
        .toLowerCase();
      inputTextDiv.innerText = transcript;
      if (currentMode === 'speech2sign') {
        // Map spoken word to sign (simplified)
        let signWord = 'hello';
        if (transcript.includes('thank')) signWord = 'thank you';
        else if (transcript.includes('yes')) signWord = 'yes';
        else if (transcript.includes('no')) signWord = 'no';
        else if (transcript.includes('please')) signWord = 'please';
        else if (transcript.includes('goodbye')) signWord = 'goodbye';
        outputTextDiv.innerText = `🤟 ${signWord}`;
        confidenceSpan.innerText = 'Confidence: 85%';
        animateSign(signWord);
        liveCaption.innerText = `🤟 Sign: ${signWord}`;
      }
    };
    recognition.onerror = (e) => console.error(e);
    recognition.start();
  }
  
  // ---------- OFFLINE STORAGE (IndexedDB) ----------
  async function initOfflineDB() {
    return new Promise((resolve) => {
      const request = indexedDB.open('SIGNAID_Offline', 1);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('translations')) {
          db.createObjectStore('translations', { keyPath: 'id', autoIncrement: true });
        }
      };
      request.onsuccess = (e) => {
        offlineDB = e.target.result;
        loadSavedTranslations();
        resolve();
      };
    });
  }
  
  async function saveTranslation(input, output, mode) {
    if (!offlineDB) return;
    const tx = offlineDB.transaction('translations', 'readwrite');
    const store = tx.objectStore('translations');
    store.add({ input, output, mode, timestamp: Date.now() });
    tx.oncomplete = () => loadSavedTranslations();
  }
  
  async function loadSavedTranslations() {
    if (!offlineDB) return;
    const tx = offlineDB.transaction('translations', 'readonly');
    const store = tx.objectStore('translations');
    const countReq = store.count();
    countReq.onsuccess = () => {
      offlineCountSpan.innerText = countReq.result;
    };
  }
  
  // ---------- UI EVENT HANDLERS ----------
  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    if (mode === 'sign2speech') {
      document.querySelector('[data-mode="sign2speech"]').classList.add('active');
      micBtn.disabled = true;
      if (cameraActive) startCamera(); // ensure camera running if needed
    } else {
      document.querySelector('[data-mode="speech2sign"]').classList.add('active');
      micBtn.disabled = false;
      if (micActive) startMicrophone();
    }
  }
  
  cameraBtn.onclick = startCamera;
  micBtn.onclick = startMicrophone;
  saveBtn.onclick = () => {
    const input = inputTextDiv.innerText;
    const output = outputTextDiv.innerText;
    if (input !== '—' && output !== '—') {
      saveTranslation(input, output, currentMode);
      alert('Saved offline');
    } else alert('No translation to save');
  };
  
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.onclick = () => setMode(btn.getAttribute('data-mode'));
  });
  
  // Auth
  auth.onAuthStateChanged((user) => {
    currentUser = user;
    if (user) {
      userStatusSpan.innerText = `👤 ${user.email}`;
      loginBtn.style.display = 'none';
      logoutBtn.style.display = 'inline-block';
    } else {
      userStatusSpan.innerText = 'Offline';
      loginBtn.style.display = 'inline-block';
      logoutBtn.style.display = 'none';
    }
  });
  loginBtn.onclick = () => window.location.href = '/firebase.html';
  logoutBtn.onclick = () => auth.signOut();
  
  // Initialize everything
  async function init() {
    initAvatar();
    await initHandTracking();
    await initOfflineDB();
    setMode('sign2speech');
  }
  init();
</script>
</body>
</html>
