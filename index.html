<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>SIGNAID – Community Sign Models</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <!-- Three.js -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>
  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, 'Segoe UI', Roboto; }
    body { background: linear-gradient(145deg, #0a0f1e 0%, #1a1f2f 100%); min-height:100vh; padding:16px; }
    .app-container { max-width:1400px; margin:0 auto; }
    .navbar { display:flex; justify-content:space-between; align-items:center; background:rgba(10,15,30,0.6); backdrop-filter:blur(12px); padding:10px 20px; border-radius:60px; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
    .logo { display:flex; align-items:center; gap:8px; font-size:1.5rem; font-weight:700; background:linear-gradient(135deg,#fff,#60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .nav-buttons { display:flex; gap:8px; }
    button { padding:8px 18px; border-radius:40px; border:none; font-weight:500; cursor:pointer; transition:0.2s; background:rgba(255,255,255,0.1); color:white; }
    .btn-primary { background:linear-gradient(135deg,#2563eb,#7c3aed); }
    .btn-outline { border:1px solid rgba(255,255,255,0.3); background:transparent; }
    .main-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media (max-width:800px) { .main-grid { grid-template-columns:1fr; } }
    .panel { background:rgba(15,23,42,0.4); backdrop-filter:blur(12px); border-radius:32px; padding:20px; border:1px solid rgba(255,255,255,0.1); }
    .avatar-container { position:relative; aspect-ratio:4/3; background:#0a0f1e; border-radius:24px; overflow:hidden; margin-bottom:16px; }
    #avatarCanvas { width:100%; height:100%; display:block; background:#111827; }
    .caption { position:absolute; bottom:12px; left:12px; right:12px; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px); padding:8px 16px; border-radius:40px; text-align:center; color:white; font-weight:500; }
    .language-row { display:flex; gap:12px; margin:16px 0; flex-wrap:wrap; }
    .lang-select { flex:1; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.2); border-radius:40px; padding:10px 16px; color:white; }
    .mode-tabs { display:flex; gap:8px; margin:16px 0; }
    .mode-btn { flex:1; background:rgba(0,0,0,0.3); border:none; padding:10px; border-radius:40px; color:#cbd5e1; cursor:pointer; }
    .mode-btn.active { background:linear-gradient(135deg,#2563eb,#7c3aed); color:white; }
    .output-box { background:rgba(0,0,0,0.4); border-radius:24px; padding:16px; margin-top:16px; }
    .output-label { font-size:0.75rem; color:#94a3b8; text-transform:uppercase; }
    .output-text { font-size:1.5rem; font-weight:600; color:white; word-break:break-word; }
    .confidence { font-size:0.8rem; color:#10b981; margin-top:8px; }
    .action-buttons { display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; }
    .action-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; background:rgba(37,99,235,0.2); border:1px solid #2563eb; }
    .action-btn.active { background:#2563eb; }
    .status-badge { display:inline-block; background:#10b98120; color:#10b981; border-radius:20px; padding:4px 12px; font-size:0.75rem; margin-left:8px; }
    .training-section { margin-top:20px; }
    .sign-buttons { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
    .sign-btn { background:rgba(37,99,235,0.3); border:1px solid #2563eb; padding:6px 12px; border-radius:30px; font-size:0.8rem; cursor:pointer; }
    .sign-btn.recording { background:#dc2626; border-color:#dc2626; animation:pulse 1s infinite; }
    .community-item { background:rgba(0,0,0,0.3); border-radius:20px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
    .community-name { font-weight:600; color:white; }
    .community-meta { font-size:0.7rem; color:#94a3b8; }
    .download-btn { background:#2563eb; border:none; padding:4px 12px; border-radius:20px; cursor:pointer; }
    @keyframes pulse { 0% { opacity:1; } 50% { opacity:0.6; } }
    footer { text-align:center; margin-top:32px; color:#64748b; font-size:0.75rem; }
    .tab-bar { display:flex; gap:8px; margin-bottom:16px; border-bottom:1px solid rgba(255,255,255,0.1); }
    .tab { padding:8px 16px; background:transparent; border:none; color:#94a3b8; cursor:pointer; }
    .tab.active { color:#60a5fa; border-bottom:2px solid #60a5fa; }
  </style>
</head>
<body>
<div class="app-container">
  <nav class="navbar">
    <div class="logo">🧠 SIGN<span style="color:#2563eb;">AID</span></div>
    <div class="nav-buttons">
      <span id="userStatus" class="status-badge">Offline</span>
      <button id="loginBtn" class="btn-outline">Sign In</button>
      <button id="logoutBtn" style="display:none;" class="btn-outline">Sign Out</button>
    </div>
  </nav>

  <div class="main-grid">
    <!-- Left panel: Camera + Avatar + Translation -->
    <div class="panel">
      <div class="avatar-container">
        <canvas id="avatarCanvas"></canvas>
        <div class="caption" id="liveCaption">🤟 Ready</div>
      </div>
      <div class="language-row">
        <select id="spokenLang" class="lang-select">
          <option value="en">English (spoken)</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="sw">Swahili</option>
        </select>
        <select id="signLang" class="lang-select">
          <option value="asl">ASL (American)</option>
          <option value="bsl">BSL (British)</option>
        </select>
      </div>
      <div class="mode-tabs">
        <button class="mode-btn active" data-mode="sign2speech">✋ Sign → Speech</button>
        <button class="mode-btn" data-mode="speech2sign">🎤 Speech → Sign</button>
      </div>
      <div class="action-buttons">
        <button id="cameraBtn" class="action-btn">📷 Start Camera</button>
        <button id="micBtn" class="action-btn" disabled>🎙️ Start Mic</button>
      </div>
    </div>

    <!-- Right panel: Translation + Training + Community -->
    <div class="panel">
      <div class="tab-bar">
        <button class="tab active" data-tab="local">🏠 Local Model</button>
        <button class="tab" data-tab="community">🌍 Community</button>
      </div>

      <!-- LOCAL MODEL TAB -->
      <div id="localTab">
        <div class="output-box">
          <div class="output-label">INPUT (recognized)</div>
          <div class="output-text" id="inputText">—</div>
        </div>
        <div class="output-box">
          <div class="output-label">OUTPUT (translation)</div>
          <div class="output-text" id="outputText">—</div>
          <div class="confidence" id="confidence">Confidence: —</div>
        </div>
        <div class="action-buttons" style="margin-top:12px;">
          <button id="saveTranslationBtn" class="btn-outline" style="flex:1;">💾 Save offline</button>
        </div>

        <div class="training-section">
          <h3 style="color:white; font-size:1rem; margin:16px 0 8px;">📖 Train Your Signs</h3>
          <div id="signsContainer" class="sign-buttons"></div>
          <div style="display:flex; gap:8px; margin:12px 0;">
            <input type="text" id="newSignName" placeholder="New sign (e.g., coffee)" class="lang-select" style="flex:2;">
            <button id="addSignBtn" class="btn-outline">➕ Add</button>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button id="clearModelBtn" class="action-btn" style="background:#dc262620;">🗑️ Clear Model</button>
            <button id="exportModelBtn" class="action-btn">💾 Export Model</button>
            <input type="file" id="importModelInput" accept=".json" style="display:none;">
            <button id="importModelBtn" class="action-btn">📂 Import Model</button>
            <button id="uploadModelBtn" class="action-btn" style="background:#10b98120;">☁️ Upload to Community</button>
          </div>
          <div id="trainingStatus" style="color:#60a5fa; font-size:0.75rem; margin-top:12px;"></div>
          <div style="margin-top:12px;">
            <p style="color:#94a3b8; font-size:0.7rem;">📚 Offline translations: <span id="offlineCount">0</span></p>
          </div>
        </div>
      </div>

      <!-- COMMUNITY TAB -->
      <div id="communityTab" style="display:none;">
        <div style="margin-bottom:12px;">
          <input type="text" id="communitySearch" placeholder="Search models..." class="lang-select" style="width:100%;">
        </div>
        <div id="communityList" style="max-height:500px; overflow-y:auto;"></div>
      </div>
    </div>
  </div>
  <footer>© SIGNAID – Train, share, and download community sign models. All data synced via Firestore.</footer>
</div>

<script type="module">
  import * as THREE from 'three';

  // ---------- FIREBASE ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBsewmLbx9LzzlhC-xzm8KPN9g-2zZFa0M",
    authDomain: "signaid-app.firebaseapp.com",
    projectId: "signaid-app",
    storageBucket: "signaid-app.firebasestorage.app",
    messagingSenderId: "520796391275",
    appId: "1:520796391275:web:748273f6d18765190bae2e"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ---------- GLOBALS ----------
  let currentMode = 'sign2speech';
  let cameraActive = false;
  let micActive = false;
  let videoStream = null;
  let hands = null;
  let cameraUtils = null;
  let recognition = null;
  let currentUser = null;
  let offlineDB = null;

  // KNN model
  let trainingSamples = {};
  let signsList = ['hello', 'thank you', 'yes', 'no', 'please', 'goodbye'];

  // Recording state
  let isRecording = false;
  let currentRecordingSign = null;
  let recordingTimer = null;
  let tempRecordedVectors = [];

  // DOM elements
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const userStatusSpan = document.getElementById('userStatus');
  const cameraBtn = document.getElementById('cameraBtn');
  const micBtn = document.getElementById('micBtn');
  const inputTextDiv = document.getElementById('inputText');
  const outputTextDiv = document.getElementById('outputText');
  const confidenceSpan = document.getElementById('confidence');
  const liveCaption = document.getElementById('liveCaption');
  const saveBtn = document.getElementById('saveTranslationBtn');
  const offlineCountSpan = document.getElementById('offlineCount');
  const spokenLangSelect = document.getElementById('spokenLang');
  const signsContainer = document.getElementById('signsContainer');
  const trainingStatusDiv = document.getElementById('trainingStatus');
  const newSignInput = document.getElementById('newSignName');
  const addSignBtn = document.getElementById('addSignBtn');
  const clearModelBtn = document.getElementById('clearModelBtn');
  const exportModelBtn = document.getElementById('exportModelBtn');
  const importModelBtn = document.getElementById('importModelBtn');
  const importModelInput = document.getElementById('importModelInput');
  const uploadModelBtn = document.getElementById('uploadModelBtn');
  const communitySearch = document.getElementById('communitySearch');
  const communityList = document.getElementById('communityList');
  const tabs = document.querySelectorAll('.tab');

  window.lastLandmarks = null;

  // ---------- 3D AVATAR (same as Phase 2) ----------
  let scene, camera3d, renderer, avatarGroup, leftArm, rightArm;
  function initAvatar() {
    const canvas = document.getElementById('avatarCanvas');
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111827);
    camera3d = new THREE.PerspectiveCamera(45, width/height, 0.1, 1000);
    camera3d.position.set(0, 1.5, 3);
    renderer = new THREE.WebGLRenderer({ canvas, alpha: false });
    renderer.setSize(width, height);
    const ambient = new THREE.AmbientLight(0x404060);
    scene.add(ambient);
    const light = new THREE.DirectionalLight(0xffffff, 0.8);
    light.position.set(2, 3, 2);
    scene.add(light);
    avatarGroup = new THREE.Group();
    const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.6;
    avatarGroup.add(body);
    const headGeo = new THREE.SphereGeometry(0.4, 32);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xfcd34d });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.2;
    avatarGroup.add(head);
    const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8);
    const armMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
    leftArm = new THREE.Mesh(armGeo, armMat);
    leftArm.position.set(-0.6, 1.0, 0);
    leftArm.rotation.z = 0.3;
    avatarGroup.add(leftArm);
    rightArm = new THREE.Mesh(armGeo, armMat);
    rightArm.position.set(0.6, 1.0, 0);
    rightArm.rotation.z = -0.3;
    avatarGroup.add(rightArm);
    scene.add(avatarGroup);
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera3d);
    }
    animate();
    window.addEventListener('resize', () => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h);
      camera3d.aspect = w/h;
      camera3d.updateProjectionMatrix();
    });
  }
  function animateSign(signWord) {
    if (!leftArm || !rightArm) return;
    let intensity = 0.5;
    if (signWord === 'hello') intensity = 0.8;
    else if (signWord === 'thank you') intensity = 0.6;
    else intensity = 0.4;
    let start = null;
    function step(timestamp) {
      if (!start) start = timestamp;
      const elapsed = (timestamp - start) / 1000;
      if (elapsed < 0.6) {
        const t = Math.sin(elapsed * Math.PI * 2) * intensity;
        leftArm.rotation.x = t * 0.8;
        rightArm.rotation.x = -t * 0.8;
        requestAnimationFrame(step);
      } else {
        leftArm.rotation.x = 0;
        rightArm.rotation.x = 0;
      }
    }
    requestAnimationFrame(step);
  }

  // ---------- KNN CLASSIFIER (same) ----------
  function getLandmarkVector(landmarks) {
    let vec = [];
    for (let lm of landmarks) vec.push(lm.x, lm.y, lm.z);
    return vec;
  }
  function classifyLandmarks(landmarks) {
    if (Object.keys(trainingSamples).length === 0) return null;
    const inputVec = getLandmarkVector(landmarks);
    let bestSign = null, bestDist = Infinity;
    for (let [sign, samples] of Object.entries(trainingSamples)) {
      for (let sample of samples) {
        let dist = 0;
        for (let i = 0; i < inputVec.length; i++) dist += (inputVec[i] - sample[i]) ** 2;
        dist = Math.sqrt(dist);
        if (dist < bestDist) { bestDist = dist; bestSign = sign; }
      }
    }
    if (bestDist < 0.65) return { sign: bestSign, confidence: Math.max(0, 1 - bestDist / 1.2) };
    return null;
  }

  // ---------- INDEXEDDB (local model + translations) ----------
  async function initOfflineDB() {
    return new Promise((resolve) => {
      const request = indexedDB.open('SIGNAID_Offline', 2);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('translations')) db.createObjectStore('translations', { keyPath: 'id', autoIncrement: true });
        if (!db.objectStoreNames.contains('model')) db.createObjectStore('model', { keyPath: 'id' });
      };
      request.onsuccess = (e) => {
        offlineDB = e.target.result;
        loadModelFromDB();
        loadSavedTranslationsCount();
        resolve();
      };
    });
  }
  async function saveModelToDB() {
    if (!offlineDB) return;
    const tx = offlineDB.transaction('model', 'readwrite');
    tx.objectStore('model').put({ id: 'knnModel', samples: trainingSamples, signsList: signsList });
  }
  async function loadModelFromDB() {
    if (!offlineDB) return;
    const tx = offlineDB.transaction('model', 'readonly');
    const req = tx.objectStore('model').get('knnModel');
    req.onsuccess = () => {
      if (req.result) {
        trainingSamples = req.result.samples;
        signsList = req.result.signsList;
        updateSignsUI();
        trainingStatusDiv.innerText = `✅ Loaded ${Object.keys(trainingSamples).length} signs locally.`;
      } else {
        signsList.forEach(s => { if (!trainingSamples[s]) trainingSamples[s] = []; });
        updateSignsUI();
      }
    };
  }
  async function loadSavedTranslationsCount() {
    if (!offlineDB) return;
    const tx = offlineDB.transaction('translations', 'readonly');
    const countReq = tx.objectStore('translations').count();
    countReq.onsuccess = () => offlineCountSpan.innerText = countReq.result;
  }
  async function saveTranslation(input, output) {
    if (!offlineDB) return;
    const tx = offlineDB.transaction('translations', 'readwrite');
    tx.objectStore('translations').add({ input, output, mode: currentMode, timestamp: Date.now() });
    tx.oncomplete = () => loadSavedTranslationsCount();
  }

  // ---------- UI: Training buttons ----------
  function updateSignsUI() {
    signsContainer.innerHTML = '';
    signsList.forEach(sign => {
      const btn = document.createElement('button');
      btn.className = 'sign-btn';
      btn.textContent = `📝 ${sign}`;
      btn.onclick = () => startRecordingForSign(sign);
      signsContainer.appendChild(btn);
    });
  }
  function startRecordingForSign(sign) {
    if (!cameraActive) { trainingStatusDiv.innerText = '❌ Start camera first.'; return; }
    if (isRecording) return;
    isRecording = true;
    currentRecordingSign = sign;
    tempRecordedVectors = [];
    trainingStatusDiv.innerText = `🔴 Recording "${sign}"... Show sign for 5 seconds.`;
    let count = 0;
    recordingTimer = setInterval(() => {
      if (!window.lastLandmarks) { trainingStatusDiv.innerText = `⚠️ No hand detected.`; return; }
      const vec = getLandmarkVector(window.lastLandmarks);
      tempRecordedVectors.push(vec);
      count++;
      trainingStatusDiv.innerText = `🔴 Recording "${sign}"... ${count}/10 samples.`;
      if (count >= 10) {
        clearInterval(recordingTimer);
        if (!trainingSamples[sign]) trainingSamples[sign] = [];
        trainingSamples[sign].push(...tempRecordedVectors);
        saveModelToDB();
        trainingStatusDiv.innerText = `✅ Added ${tempRecordedVectors.length} samples for "${sign}".`;
        isRecording = false;
      }
    }, 500);
  }
  function clearModel() {
    trainingSamples = {};
    signsList.forEach(s => trainingSamples[s] = []);
    saveModelToDB();
    updateSignsUI();
    trainingStatusDiv.innerText = '🗑️ Model cleared.';
  }
  function exportModel() {
    const data = { trainingSamples, signsList };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'signaid_model.json';
    a.click();
    URL.revokeObjectURL(url);
  }
  function importModel(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        trainingSamples = data.trainingSamples;
        signsList = data.signsList;
        saveModelToDB();
        updateSignsUI();
        trainingStatusDiv.innerText = '✅ Model imported.';
      } catch(err) { trainingStatusDiv.innerText = '❌ Invalid file.'; }
    };
    reader.readAsText(file);
  }

  // ---------- PHASE 3: FIRESTORE SYNC ----------
  async function uploadModelToCommunity() {
    if (!currentUser) { alert('Please sign in to upload.'); return; }
    if (Object.keys(trainingSamples).length === 0) { alert('No trained samples to upload.'); return; }
    const modelName = prompt('Give your model a name (e.g., "My ASL signs")', 'My Model');
    if (!modelName) return;
    const description = prompt('Short description', 'Trained with SIGNAID');
    const signLang = document.getElementById('signLang').value;
    const modelData = { trainingSamples, signsList };
    try {
      await db.collection('community_models').add({
        name: modelName,
        description: description,
        signLanguage: signLang,
        modelData: JSON.stringify(modelData),
        uploaderUid: currentUser.uid,
        uploaderEmail: currentUser.email,
        downloads: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      trainingStatusDiv.innerText = '✅ Model uploaded to community!';
      loadCommunityModels();
    } catch (err) {
      console.error(err);
      trainingStatusDiv.innerText = '❌ Upload failed. Check permissions.';
    }
  }
  async function loadCommunityModels(searchTerm = '') {
    communityList.innerHTML = '<div style="color:#94a3b8; text-align:center;">Loading models...</div>';
    try {
      let query = db.collection('community_models').orderBy('createdAt', 'desc');
      const snapshot = await query.get();
      if (snapshot.empty) { communityList.innerHTML = '<div style="color:#94a3b8; text-align:center;">No models yet. Be the first to upload!</div>'; return; }
      communityList.innerHTML = '';
      snapshot.forEach(doc => {
        const data = doc.data();
        const name = data.name || 'Unnamed';
        const desc = data.description || '';
        const lang = data.signLanguage || 'asl';
        const downloads = data.downloads || 0;
        if (searchTerm && !name.toLowerCase().includes(searchTerm.toLowerCase()) && !desc.toLowerCase().includes(searchTerm.toLowerCase())) return;
        const div = document.createElement('div');
        div.className = 'community-item';
        div.innerHTML = `
          <div>
            <div class="community-name">${escapeHtml(name)}</div>
            <div class="community-meta">${escapeHtml(desc)} | ${lang.toUpperCase()} | ⬇️ ${downloads}</div>
          </div>
          <button class="download-btn" data-id="${doc.id}">Download</button>
        `;
        communityList.appendChild(div);
      });
      document.querySelectorAll('.download-btn').forEach(btn => {
        btn.onclick = async () => {
          const docId = btn.getAttribute('data-id');
          await downloadModel(docId);
        };
      });
    } catch (err) {
      console.error(err);
      communityList.innerHTML = '<div style="color:#ef4444;">Failed to load community models.</div>';
    }
  }
  async function downloadModel(docId) {
    try {
      const doc = await db.collection('community_models').doc(docId).get();
      if (!doc.exists) return;
      const data = doc.data();
      const modelData = JSON.parse(data.modelData);
      trainingSamples = modelData.trainingSamples;
      signsList = modelData.signsList;
      await saveModelToDB();
      updateSignsUI();
      trainingStatusDiv.innerText = `✅ Downloaded "${data.name}". Model ready.`;
      // Increment download count
      await db.collection('community_models').doc(docId).update({ downloads: firebase.firestore.FieldValue.increment(1) });
      // Switch to local tab
      document.querySelector('[data-tab="local"]').click();
    } catch (err) {
      console.error(err);
      trainingStatusDiv.innerText = '❌ Download failed.';
    }
  }
  function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  // ---------- MEDIAPIPE HANDS ----------
  async function initHandTracking() {
    hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    hands.onResults((results) => {
      if (!cameraActive) return;
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        window.lastLandmarks = landmarks;
        if (currentMode === 'sign2speech') {
          const result = classifyLandmarks(landmarks);
          if (result) {
            inputTextDiv.innerText = result.sign;
            confidenceSpan.innerText = `Confidence: ${(result.confidence*100).toFixed(0)}%`;
            outputTextDiv.innerText = result.sign;
            liveCaption.innerText = `✋ Recognized: ${result.sign}`;
            animateSign(result.sign);
            if ('speechSynthesis' in window) {
              const utterance = new SpeechSynthesisUtterance(result.sign);
              utterance.lang = spokenLangSelect.value;
              window.speechSynthesis.cancel();
              window.speechSynthesis.speak(utterance);
            }
          } else {
            inputTextDiv.innerText = '?';
            confidenceSpan.innerText = 'Confidence: low';
          }
        }
      } else {
        if (currentMode === 'sign2speech') { inputTextDiv.innerText = '—'; confidenceSpan.innerText = 'Confidence: —'; }
      }
    });
  }
  async function startCamera() {
    if (cameraActive) {
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());
      if (cameraUtils) cameraUtils.stop();
      cameraActive = false;
      cameraBtn.innerText = '📷 Start Camera';
      cameraBtn.classList.remove('active');
      liveCaption.innerText = 'Camera off';
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      videoStream = stream;
      const videoElement = document.createElement('video');
      videoElement.srcObject = stream;
      videoElement.play();
      cameraUtils = new Camera(videoElement, { onFrame: async () => await hands.send({ image: videoElement }), width: 640, height: 480 });
      cameraUtils.start();
      cameraActive = true;
      cameraBtn.innerText = '📷 Stop Camera';
      cameraBtn.classList.add('active');
      liveCaption.innerText = 'Camera on – show trained signs';
    } catch(err) { alert('Camera permission denied'); }
  }

  // ---------- SPEECH RECOGNITION (simplified) ----------
  function startMicrophone() {
    if (!('webkitSpeechRecognition' in window)) { alert('Speech recognition not supported'); return; }
    if (micActive) {
      recognition.stop();
      micActive = false;
      micBtn.innerText = '🎙️ Start Mic';
      micBtn.classList.remove('active');
      liveCaption.innerText = 'Mic off';
      return;
    }
    recognition = new webkitSpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = spokenLangSelect.value;
    recognition.onstart = () => { micActive = true; micBtn.innerText = '🎙️ Stop Mic'; micBtn.classList.add('active'); liveCaption.innerText = 'Listening...'; };
    recognition.onresult = (event) => {
      const transcript = Array.from(event.results).map(res => res[0].transcript).join(' ').toLowerCase();
      inputTextDiv.innerText = transcript;
      if (currentMode === 'speech2sign') {
        let found = signsList.find(s => transcript.includes(s));
        if (!found) found = 'hello';
        outputTextDiv.innerText = `🤟 ${found}`;
        confidenceSpan.innerText = 'Confidence: 80%';
        animateSign(found);
        liveCaption.innerText = `🤟 Sign: ${found}`;
      }
    };
    recognition.start();
  }

  // ---------- UI EVENTS ----------
  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    if (mode === 'sign2speech') {
      document.querySelector('[data-mode="sign2speech"]').classList.add('active');
      micBtn.disabled = true;
      if (micActive) startMicrophone();
    } else {
      document.querySelector('[data-mode="speech2sign"]').classList.add('active');
      micBtn.disabled = false;
    }
  }
  document.querySelectorAll('.mode-btn').forEach(btn => btn.onclick = () => setMode(btn.getAttribute('data-mode')));
  cameraBtn.onclick = startCamera;
  micBtn.onclick = startMicrophone;
  saveBtn.onclick = () => { const inp = inputTextDiv.innerText, out = outputTextDiv.innerText; if (inp !== '—' && out !== '—') saveTranslation(inp, out); else alert('Nothing to save'); };
  addSignBtn.onclick = () => { const newName = newSignInput.value.trim(); if (newName && !signsList.includes(newName)) { signsList.push(newName); trainingSamples[newName] = []; updateSignsUI(); saveModelToDB(); newSignInput.value = ''; trainingStatusDiv.innerText = `Added "${newName}".`; } else alert('Duplicate or empty'); };
  clearModelBtn.onclick = clearModel;
  exportModelBtn.onclick = exportModel;
  importModelBtn.onclick = () => importModelInput.click();
  importModelInput.onchange = (e) => { if (e.target.files.length) importModel(e.target.files[0]); };
  uploadModelBtn.onclick = uploadModelToCommunity;
  communitySearch.oninput = (e) => loadCommunityModels(e.target.value);
  tabs.forEach(tab => {
    tab.onclick = () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.getAttribute('data-tab');
      document.getElementById('localTab').style.display = target === 'local' ? 'block' : 'none';
      document.getElementById('communityTab').style.display = target === 'community' ? 'block' : 'none';
      if (target === 'community') loadCommunityModels();
    };
  });

  // ---------- AUTH ----------
  auth.onAuthStateChanged((user) => {
    currentUser = user;
    if (user) {
      userStatusSpan.innerText = `👤 ${user.email}`;
      loginBtn.style.display = 'none';
      logoutBtn.style.display = 'inline-block';
    } else {
      userStatusSpan.innerText = 'Offline';
      loginBtn.style.display = 'inline-block';
      logoutBtn.style.display = 'none';
    }
  });
  loginBtn.onclick = () => window.location.href = '/firebase.html';
  logoutBtn.onclick = () => auth.signOut();

  // ---------- INIT ----------
  async function init() {
    initAvatar();
    await initHandTracking();
    await initOfflineDB();
    setMode('sign2speech');
  }
  init();
</script>
</body>
</html>
